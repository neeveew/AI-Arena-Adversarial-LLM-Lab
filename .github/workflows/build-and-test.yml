name: Build and test

# The repository carries ~490 console-runner tests that only ever ran on a
# developer machine. Both runners already exit non-zero on failure, so nothing
# was needed to make them gate a change except somewhere to run them.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Recheck the public download even when no source changes are pushed.
    - cron: '23 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    if: github.event_name != 'schedule'
    # net10.0-windows will not restore on Linux without EnableWindowsTargeting,
    # and the WPF suite needs STA, so the runner has to match the real build.
    runs-on: windows-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Restore the solution
        run: dotnet restore "AI Arena - WPF.sln"

      - name: Build the solution
        run: dotnet build "AI Arena - WPF.sln" --no-restore --configuration Debug

      - name: Run the core test suite
        run: dotnet run --project tests/AIArena.Tests/AIArena.Tests.csproj --no-build

      - name: Run the WPF test suite
        run: dotnet run --project tests/AIArena.Wpf.Tests/AIArena.Wpf.Tests.csproj --no-build

      - name: Test dependency index source boundaries
        shell: pwsh
        run: ./scripts/tests/dependency-index.tests.ps1

      - name: Check the dependency index is current
        shell: pwsh
        run: ./scripts/dependency-index.ps1 -Check

      - name: Test the XAML hard-coded-value ratchet
        shell: pwsh
        run: ./scripts/tests/xaml-hardcoded-values.tests.ps1

      - name: Test installer scope migration
        shell: pwsh
        run: ./scripts/tests/installer-migration.tests.ps1

      - name: Test Authenticode release preflight
        shell: pwsh
        run: ./scripts/tests/release-security.tests.ps1

      - name: Check XAML gained no hard-coded values
        shell: pwsh
        env:
          XAML_BASELINE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          # Hashtable splatting, not array. Splatting an array passes its
          # elements positionally, so '-BaselineRef' and the SHA arrived as bare
          # arguments and the gate rejected the SHA as an unexpected positional.
          $gateArguments = @{ Check = $true }
          if ($env:XAML_BASELINE_REF -match '^[0-9a-fA-F]{40}$' -and
              $env:XAML_BASELINE_REF -notmatch '^0{40}$') {
            $gateArguments.BaselineRef = $env:XAML_BASELINE_REF
          }
          & ./scripts/xaml-hardcoded-values.ps1 @gateArguments

  release-published:
    name: Published download is available
    # The README advertises the last public installer, independently of the
    # source build version. Reject drafts and broken links on every event.
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test public download validation
        shell: pwsh
        run: ./scripts/tests/check-published-release.tests.ps1

      - name: Verify the advertised release and installer are public
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/check-published-release.ps1
